name: MongoDB Keep-Alive

on:
  schedule:
    # Runs every 6 hours. Adjust cadence as needed — Atlas free-tier
    # inactivity windows are typically measured in days, so this has
    # comfortable margin without pinging excessively.
    - cron: "0 */6 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab too

jobs:
  ping-mongodb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install mongoose
        run: npm install mongoose --no-save
        working-directory: backend

      - name: Ping MongoDB Atlas
        working-directory: backend
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: node scripts/pingDb.js
